services:
  rumi-api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8787
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the deployment environment}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.2-sol}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    ports:
      - "127.0.0.1:8787:8787"
