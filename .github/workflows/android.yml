name: Build RUMI Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - - uses: android-actions/setup-android@v4
  with:packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate RUMI web assets
        run: |
          node --check app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/rumi20.js
          node --check app/src/main/assets/www/rumi21.js
          node --check app/src/main/assets/www/rumi30.js
          node --check app/src/main/assets/www/sw.js
          node --test tests/rumi21.test.cjs tests/rumi30.test.cjs
          node --check app/src/main/assets/www/avatar3d.js
          node --check server/server.js
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path("app/src/main/assets/www/app.js").read_text()
          assert p.count('id:"') == 20, "Expected 20 mission definitions"
          assert Path("app/src/main/assets/www/rumi20.js").exists()
          assert Path("app/src/main/assets/www/rumi21.js").exists()
          assert Path("app/src/main/assets/www/rumi30.js").exists()
          assert Path("app/src/main/assets/www/sw.js").exists()
          print("RUMI 30 assets validated")
          PYCODE
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RUMI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
